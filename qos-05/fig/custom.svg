<svg xmlns="http://www.w3.org/2000/svg" width="640" height="520" viewBox="0 0 640 520" font-family="Carlito, Calibri, 'Liberation Sans', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#292929">
  <title>Custom Mininet topology: three switches in a tree, one host on each</title>
  <defs>
    <style>
      .host   { fill: #E6F6F5; stroke: #00A499; stroke-width: 2; }
      .switch { fill: #E6F9FC; stroke: #05C3DE; stroke-width: 2; rx: 8; ry: 8; }
      .link   { stroke: #292929; stroke-width: 2.5; fill: none; }
      .name   { font-size: 18px; font-weight: bold; text-anchor: middle; }
      .label  { font-size: 14px; }
      .param  { font-size: 14px; fill: #818386; }
    </style>
  </defs>

  <!-- links (drawn first so boxes cover their ends) -->
  <line class="link" x1="320" y1="70"  x2="320" y2="190" />
  <line class="link" x1="320" y1="250" x2="130" y2="320" />
  <line class="link" x1="320" y1="250" x2="510" y2="320" />
  <line class="link" x1="130" y1="380" x2="130" y2="450" />
  <line class="link" x1="510" y1="380" x2="510" y2="450" />

  <!-- h1 -->
  <rect class="host" x="250" y="10" width="140" height="60" />
  <text class="name" x="320" y="46">h1</text>
  <text class="label" x="332" y="140">10.1.0.11/8</text>

  <!-- s1 -->
  <rect class="switch" x="250" y="190" width="140" height="60" />
  <text class="name" x="320" y="226">s1</text>

  <!-- s1–s2 parameters -->
  <text class="param" x="100" y="272">bw = 10 Mbit/s</text>
  <text class="param" x="100" y="290">delay = 30 ms</text>

  <!-- s1–s3 parameters -->
  <text class="param" x="445" y="272">bw = 15 Mbit/s</text>
  <text class="param" x="445" y="290">delay = 50 ms</text>

  <!-- s2 -->
  <rect class="switch" x="60" y="320" width="140" height="60" />
  <text class="name" x="130" y="356">s2</text>
  <text class="label" x="142" y="420">10.1.0.22/8</text>

  <!-- s3 -->
  <rect class="switch" x="440" y="320" width="140" height="60" />
  <text class="name" x="510" y="356">s3</text>
  <text class="label" x="522" y="420">10.1.0.33/8</text>

  <!-- h2 -->
  <rect class="host" x="60" y="450" width="140" height="60" />
  <text class="name" x="130" y="486">h2</text>

  <!-- h3 -->
  <rect class="host" x="440" y="450" width="140" height="60" />
  <text class="name" x="510" y="486">h3</text>
</svg>
