[project]
name = "qos-02"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "bokeh>=3.9.2",
    "jupyter-bokeh>=4.1.0",
    "jupyterlab>=4.6.4",
    "loguru>=0.7.3",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "numpy>=2.5.3",
    "panel>=1.9.4",
    "simpy>=4.1.2",
]

[tool.ruff.lint.isort]
# The notebook and lib/*.py import "lib.*" with the kernel working directory
# set to qos_02/; the package is not installed.
known-first-party = ["lib"]

[tool.ruff.lint.per-file-ignores]
# The imports cell prepares names that only the students' task cells use.
"*.ipynb" = ["F401"]
