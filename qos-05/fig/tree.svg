<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="Carlito, Calibri, 'Liberation Sans', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#292929">
  <title>Tree topology with depth 2 and fanout 2: root switch, two child switches, four hosts</title>
  <defs>
    <style>
      .host   { fill: #E6F6F5; stroke: #00A499; stroke-width: 2; }
      .switch { fill: #E6F9FC; stroke: #05C3DE; stroke-width: 2; rx: 8; ry: 8; }
      .link   { stroke: #292929; stroke-width: 2.5; fill: none; }
      .name   { font-size: 18px; font-weight: bold; text-anchor: middle; }
    </style>
  </defs>

  <!-- links -->
  <line class="link" x1="320" y1="70"  x2="170" y2="160" />
  <line class="link" x1="320" y1="70"  x2="470" y2="160" />
  <line class="link" x1="170" y1="220" x2="90"  y2="300" />
  <line class="link" x1="170" y1="220" x2="250" y2="300" />
  <line class="link" x1="470" y1="220" x2="390" y2="300" />
  <line class="link" x1="470" y1="220" x2="550" y2="300" />

  <!-- root switch -->
  <rect class="switch" x="260" y="10" width="120" height="60" />
  <text class="name" x="320" y="46">s1</text>

  <!-- child switches -->
  <rect class="switch" x="110" y="160" width="120" height="60" />
  <text class="name" x="170" y="196">s2</text>
  <rect class="switch" x="410" y="160" width="120" height="60" />
  <text class="name" x="470" y="196">s3</text>

  <!-- hosts -->
  <rect class="host" x="40" y="300" width="100" height="50" />
  <text class="name" x="90" y="331">h1</text>
  <rect class="host" x="200" y="300" width="100" height="50" />
  <text class="name" x="250" y="331">h2</text>
  <rect class="host" x="340" y="300" width="100" height="50" />
  <text class="name" x="390" y="331">h3</text>
  <rect class="host" x="500" y="300" width="100" height="50" />
  <text class="name" x="550" y="331">h4</text>
</svg>
